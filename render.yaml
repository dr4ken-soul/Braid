services:
  - type: web
    name: braid-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: BRAID_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SIGNING_SECRET
        sync: false
      - key: BRAID_DEMO_TOKEN
        sync: false
      - key: BRAID_TOOL_TOKEN
        sync: false
      - key: BRAID_DEPLOYMENT_URL
        sync: false